[package]
name = "hermes-voicedesk"
version = "0.1.0"
description = "Hermes VoiceDesk — Real-time voice AI desktop app for Hermes Agent"
authors = ["guancyxx"]
license = "MIT"
repository = "https://github.com/guancyxx/hermes-voicedesk"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
# Audio
cpal = "0.18"
# ort = "2.0.0-rc.13"  # ONNX Runtime for silero-vad (Phase 1.5)
ringbuf = "0.4"
